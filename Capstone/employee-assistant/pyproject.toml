[project]
name = "employee-assistant"
version = "0.1.0"
description = "Enterprise AI Employee Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "together>=2.32.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "pymupdf>=1.28.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.0.0",
    "qdrant-client>=1.19.0",
    "langchain-qdrant>=1.1.0",
    "flashrank>=0.2.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
