[project]
name = "llm-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariharan S", email = "hariharan@ideas2it.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "together>=2.32.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
llm-api = "llm_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "websockets>=16.1.1",
]
